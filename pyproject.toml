[project]
name = "sharetop"
version = "0.1.5"
description = "ShareTop Python Client"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ShareTop Team", email = "support@sharetop.top"}
]
keywords = ["finance", "stock", "market-data", "trading", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "typing-extensions>=4.0.0",
    "pandas>=1.5.0",
    "aiohttp>=3.9.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
gevent = ["gevent>=23.0.0"]
full = ["sharetop[gevent]"]

[project.urls]
Documentation = "https://sharetop.top"
Repository = "https://github.com/sharetop-org/sharetop"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sharetop*"]

[tool.setuptools.package-data]
sharetop = ["py.typed"]

[dependency-groups]
dev = [
    "datamodel-code-generator[http]>=0.45.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
